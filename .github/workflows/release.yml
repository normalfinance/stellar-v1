name: Build and Release
on:
  push:
    tags:
      - "v*" # triggered whenever a new tag (prefixed with "v") is pushed to the repository

permissions: # required permissions for the workflow
  id-token: write
  contents: write
  attestations: write

jobs:
  # Calculator contract
  release-contract-calculator:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Contract release"
      relative_path: "contracts/calculator"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  # Long Short Pair Factory contract
  release-contract-long-short-pair-factory:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Contract release"
      relative_path: "contracts/long_short_pair_factory"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
