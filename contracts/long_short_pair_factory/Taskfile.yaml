version: "3"
tasks:
  clean:
    cmd: cargo clean

  fmt:
    cmd: cargo fmt --all

  check:
    cmd: cargo check

  build:
    cmds:
      - task -d ../long_short_pair build || exit 1
      - soroban contract build --package long_short_pair_factory
      - soroban contract optimize --wasm ../../target/wasm32v1-none/release/long_short_pair_factory.wasm --wasm-out ../../target/wasm32v1-none/release/long_short_pair_factory.wasm
      - cp ../../target/wasm32v1-none/release/long_short_pair_factory.wasm ../../wasm/long_short_pair_factory.wasm

  test:
    deps:
      - build
    cmd: cargo test

  test_slow:
    cmds:
      - task: test

  default:
    cmds:
      - task: build

  all:
    cmds:
      - task: clean
      - task: fmt
      - task: build
      - task: check
      - task: test
