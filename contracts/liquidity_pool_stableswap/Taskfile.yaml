version: "3"
tasks:
  clean:
    cmd: cargo clean

  fmt:
    cmd: cargo fmt --all

  check:
    cmd: cargo check

  build:
    cmds:
      - task -d ../config_storage build || exit 1
      - task -d ../rewards_gauge build || exit 1
      - task -d ../token build || exit 1
      - task -d ../liquidity_pool_plane build || exit 1
      - soroban contract build --package liquidity_pool_stableswap
      - soroban contract optimize --wasm ../../target/wasm32v1-none/release/liquidity_pool_stableswap.wasm --wasm-out ../../target/wasm32v1-none/release/liquidity_pool_stableswap.wasm
      - cp ../../target/wasm32v1-none/release/liquidity_pool_stableswap.wasm ../../wasm/liquidity_pool_stableswap.wasm

  test:
    deps:
      - build
    cmds:
      - cargo test

  test_slow:
    cmds:
      - task: test

  default:
    cmds:
      - task: build

  all:
    cmds:
      - task: clean
      - task: fmt
      - task: build
      - task: check
      - task: test
