[workspace]
resolver = "2"
members = ["contracts/*", "modules/*"]

[workspace.package]
version = "1.0.0"
rust-version = "1.86"

[workspace.dependencies]
soroban-sdk = { version = "22.0.6" }
soroban-token-sdk = { version = "22.0.6" }
soroban-fixed-point-math = { version = "=1.3.0" }
paste = { version = "1.0.15" }
sep-40-oracle = "=1.2.2"
utils = { path = "modules/utils" }
token_share = { path = "modules/token_share" }
rewards = { path = "modules/rewards" }
access_control = { path = "modules/access_control" }
upgrade = { path = "modules/upgrade" }
oracle = { path = "modules/oracle" }
liquidity-pool-validation-errors = { path = "modules/liquidity_pool_validation_errors" }
liquidity-pool-events = { path = "modules/liquidity_pool_events" }
liquidity-pool-rewards-gauge = { path = "modules/liquidity_pool_reward_gauge" }
liquidity-pool-config-storage = { path = "modules/liquidity_pool_config_storage" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
